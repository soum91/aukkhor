name: Aukkhor
options:
  bundleIdPrefix: dev.soum91.aukkhor
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Manual
    # CI overrides this with 0.2.<build>; FlareStore only compares x.y.z.
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: '1'
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
targets:
  Aukkhor:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Keyboard/KeyboardViewController.swift
      - path: Shared
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.soum91.aukkhor
        INFOPLIST_KEY_CFBundleDisplayName: Aukkhor
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 'Aukkhor'
        CFBundleName: 'Aukkhor'
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: dev.soum91.aukkhor
            CFBundleURLSchemes:
              - aukkhor
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Optional experimental screenshot mode uses active location updates to try to keep Aukkhor running in the background. Coordinates are not stored or transmitted.
        NSLocationAlwaysAndWhenInUseUsageDescription: Optional experimental screenshot mode uses background location updates to try to observe new screenshots. This consumes battery and does not store or transmit coordinates.
        UIBackgroundModes:
          - location
        NSPhotoLibraryUsageDescription: Aukkhor optionally reads newly saved screenshots to copy them automatically to your clipboard while its app or keyboard is active.
        NSLocalNetworkUsageDescription: Aukkhor connects to your chosen Windows PC over local Wi-Fi for clipboard and opt-in code forwarding.
        AukkhorKeychainGroup: $(AppIdentifierPrefix)dev.soum91.aukkhor.shared
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/Aukkhor.entitlements
    dependencies:
      - target: AukkhorKeyboard
        embed: true
  AukkhorKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.soum91.aukkhor.keyboard
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Aukkhor Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: 'Aukkhor Keyboard'
        CFBundleName: 'Aukkhor Keyboard'
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSPhotoLibraryUsageDescription: Aukkhor optionally reads newly saved screenshots to copy them automatically to your clipboard while its app or keyboard is active.
        NSLocalNetworkUsageDescription: Aukkhor transfers clipboard text to your paired Windows PC on the local network.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en
            RequestsOpenAccess: true
        AukkhorKeychainGroup: $(AppIdentifierPrefix)dev.soum91.aukkhor.shared
    entitlements:
      path: Keyboard/AukkhorKeyboard.entitlements
  AukkhorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Aukkhor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AukkhorUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Aukkhor
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Aukkhor
schemes:
  Aukkhor:
    build:
      targets:
        Aukkhor: all
    test:
      targets:
        - AukkhorTests
        - AukkhorUITests
    archive:
      config: Release

