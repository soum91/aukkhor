name: Aukkhor Android TV keyboard
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-tv/**'
      - '.github/workflows/android-tv.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug Android TV APK
        working-directory: android-tv
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -s android-tv/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Aukkhor-TV-debug-${{ github.run_number }}
          path: android-tv/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
