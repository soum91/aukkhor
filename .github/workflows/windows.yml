name: Aukkhor Windows companion build
on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
permissions:
  contents: read
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and publish native Windows x64 companion
        shell: pwsh
        run: |
          dotnet publish windows/Aukkhor.Windows/Aukkhor.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
          if (!(Test-Path publish/Aukkhor.Windows.exe)) { throw 'Companion EXE is missing' }
          Compress-Archive -Path publish/* -DestinationPath Aukkhor-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Aukkhor-Windows-x64-${{ github.run_number }}
          path: Aukkhor-Windows-x64.zip
          if-no-files-found: error

