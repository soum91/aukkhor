name: Publish Aukkhor preview and FlareStore feed
on:
  workflow_run:
    workflows: ["Aukkhor iOS unsigned build"]
    types: [completed]
permissions:
  contents: write
  actions: read
concurrency:
  group: aukkhor-preview-publishing
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download verified iOS build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Aukkhor-iOS-unsigned-${{ github.event.workflow_run.run_number }}
          github-token: ${{ github.token }}
          path: dist
      - name: Download compatibility IPA from same verified build
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.workflow_run.id }}
          name: Aukkhor-iOS-compat-${{ github.event.workflow_run.run_number }}
          github-token: ${{ github.token }}
          path: dist
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 0.2.0.${{ github.event.workflow_run.run_number }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test -s dist/Aukkhor-unsigned.ipa
          test -s dist/Aukkhor-compat-unsigned.ipa
          TAG="v${VERSION}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/Aukkhor-unsigned.ipa dist/Aukkhor-compat-unsigned.ipa --clobber
          else
            gh release create "${TAG}" dist/Aukkhor-unsigned.ipa \
              --target "${TARGET_SHA}" --prerelease \
              --title "Aukkhor ${VERSION} preview" \
              --notes "Unsigned IPA previews. Use the normal IPA when your signer supports matching App Group and Keychain entitlements; use the compatibility IPA if signing rejects them (extension preference sharing and Windows pairing inside the keyboard are reduced). iPhone installation and remote typing still need device tests."
          fi
      - name: Update FlareStore source aliases
        env:
          VERSION: 0.2.0.${{ github.event.workflow_run.run_number }}
          BUILD: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          python3 scripts/update_feed.py --version "${VERSION}" --build-number "${BUILD}" --ipa dist/Aukkhor-unsigned.ipa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json source.json
          if ! git diff --cached --quiet; then
            git commit -m "catalog: publish Aukkhor ${VERSION}"
            git push origin HEAD:main
          fi
