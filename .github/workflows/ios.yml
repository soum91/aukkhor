name: Aukkhor iOS unsigned build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare approved Aukkhor icon for asset catalog
        run: |
          sips -z 1024 1024 ios/Assets.xcassets/AppIcon.appiconset/AukkhorIcon.png >/dev/null
          sips -g pixelWidth -g pixelHeight ios/Assets.xcassets/AppIcon.appiconset/AukkhorIcon.png
      - name: Show Xcode and iPhoneOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun simctl list runtimes
      - name: Discover installed Simulator application
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, plistlib
          found=[]
          for base, dirs, files in os.walk('/Applications'):
              for name in list(dirs):
                  path=pathlib.Path(base)/name
                  if name.endswith('.app'):
                      if 'simulator' in name.lower():
                          try:
                              info=plistlib.loads((path/'Contents/Info.plist').read_bytes())
                              if info.get('CFBundleIdentifier')=='com.apple.iphonesimulator':
                                  found.append(str(path))
                          except (OSError, ValueError): pass
                      if not name.startswith('Xcode'): dirs.remove(name)
                  elif name.endswith(('.sdk','.framework','.simruntime')): dirs.remove(name)
          print('Simulator applications:', found or 'No GUI application installed; use simctl/xcodebuild')
          with open(os.environ['GITHUB_ENV'],'a') as output:
              output.write('AUKKHOR_SIMULATOR_APP='+(found[0] if found else '')+'\n')
          PYCODE
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile app and embedded keyboard
        run: |
          set -euo pipefail
          xcodebuild -project ios/Aukkhor.xcodeproj -scheme Aukkhor -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/AukkhorDerived" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION='${{ github.run_number }}' build
          APP="$RUNNER_TEMP/AukkhorDerived/Build/Products/Release-iphoneos/Aukkhor.app"
          test -d "$APP/PlugIns/AukkhorKeyboard.appex"
          test ! -d "$APP/PlugIns/AukkhorShare.appex"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/AukkhorKeyboard.appex/Info.plist" | grep -Fx com.apple.keyboard-service
          for plist in "$APP/Info.plist" "$APP/PlugIns/AukkhorKeyboard.appex/Info.plist"; do
            display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")
            test -n "$display_name" || { echo "::error::Missing CFBundleDisplayName in $plist"; exit 1; }
            echo "$plist: $display_name"
          done
          mkdir -p "$RUNNER_TEMP/AukkhorPackage/Payload"
          cp -R "$APP" "$RUNNER_TEMP/AukkhorPackage/Payload/"
          (cd "$RUNNER_TEMP/AukkhorPackage" && zip -qr "$GITHUB_WORKSPACE/Aukkhor-unsigned.ipa" Payload)
      - name: Inspect arm64 architecture and bundle metadata
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AukkhorDerived/Build/Products/Release-iphoneos/Aukkhor.app"
          xcrun lipo -archs "$APP/Aukkhor" | grep -w arm64
          xcrun lipo -archs "$APP/PlugIns/AukkhorKeyboard.appex/AukkhorKeyboard" | grep -w arm64
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -Fx iPhoneOS
      - name: Audit keyboard-only IPA before publishing
        env:
          EXPECTED_BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, plistlib, zipfile
          with zipfile.ZipFile('Aukkhor-unsigned.ipa') as ipa:
              names=set(ipa.namelist())
              host='Payload/Aukkhor.app/Info.plist'
              keyboard='Payload/Aukkhor.app/PlugIns/AukkhorKeyboard.appex/Info.plist'
              assert host in names and keyboard in names, 'Host or keyboard Info.plist missing'
              assert not any('/AukkhorShare.appex/' in n for n in names), 'Share extension must be absent'
              root=plistlib.loads(ipa.read(host))
              ext=plistlib.loads(ipa.read(keyboard))
              assert root['CFBundleIdentifier']=='dev.soum91.aukkhor'
              assert ext['CFBundleIdentifier']=='dev.soum91.aukkhor.keyboard'
              assert ext['NSExtension']['NSExtensionPointIdentifier']=='com.apple.keyboard-service'
              for name, info in [(host,root),(keyboard,ext)]:
                  assert str(info.get('CFBundleDisplayName','')).strip(), name
                  assert str(info.get('CFBundleVersion')) == os.environ['EXPECTED_BUILD'], (name, info.get('CFBundleVersion'))
                  assert info.get('CFBundleShortVersionString') == '0.2.0', (name, info.get('CFBundleShortVersionString'))
              print('Validated exactly one embedded keyboard extension')
          PY
      # Explicit one-off publication at the owner's request. Normal pushes still run both test stages.
      - name: Test actual keyboard layout and render theme evidence
        if: ${{ !contains(github.event.head_commit.message, '[publish-unverified]') }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin)["devices"]; runtimes=sorted((r for r in d if "iOS-" in r), key=lambda r:tuple(map(int,re.findall(r"\d+",r))), reverse=True); print(next(x["udid"] for r in runtimes for x in d[r] if x["name"].startswith("iPhone")))')
          echo "AUKKHOR_SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool NO
          xcrun simctl boot "$DEVICE" || true
          if [ -n "$AUKKHOR_SIMULATOR_APP" ]; then open -a "$AUKKHOR_SIMULATOR_APP" --args -CurrentDeviceUDID "$DEVICE"; fi
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test -project ios/Aukkhor.xcodeproj -scheme Aukkhor -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/AukkhorSimulatorDerived" -parallel-testing-enabled NO -only-testing:AukkhorTests -resultBundlePath KeyboardLayout.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Test installed keyboard extension and capture full screen
        if: ${{ !contains(github.event.head_commit.message, '[publish-unverified]') && !contains(github.event.head_commit.message, '[native-tests]') }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$AUKKHOR_SIMULATOR"
          xcrun simctl boot "$AUKKHOR_SIMULATOR"
          if [ -n "$AUKKHOR_SIMULATOR_APP" ]; then open -a "$AUKKHOR_SIMULATOR_APP" --args -CurrentDeviceUDID "$AUKKHOR_SIMULATOR"; fi
          xcrun simctl bootstatus "$AUKKHOR_SIMULATOR" -b
          set +e
          xcodebuild test -project ios/Aukkhor.xcodeproj -scheme Aukkhor -configuration Debug -destination "platform=iOS Simulator,id=$AUKKHOR_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/AukkhorSimulatorDerived" -parallel-testing-enabled NO -only-testing:AukkhorUITests -resultBundlePath KeyboardIntegration.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/AukkhorUITest.log"
          ui_status=${PIPESTATUS[0]}
          set -e
          if [ "$ui_status" -ne 0 ] && grep -q 'Timed out waiting for AX loaded notification' "$RUNNER_TEMP/AukkhorUITest.log"; then
            echo 'Restarting simulator once after accessibility-service initialization failure'
            xcrun simctl shutdown "$AUKKHOR_SIMULATOR"
            xcrun simctl boot "$AUKKHOR_SIMULATOR"
            if [ -n "$AUKKHOR_SIMULATOR_APP" ]; then open -a "$AUKKHOR_SIMULATOR_APP" --args -CurrentDeviceUDID "$AUKKHOR_SIMULATOR"; fi
            xcrun simctl bootstatus "$AUKKHOR_SIMULATOR" -b
            xcodebuild test -project ios/Aukkhor.xcodeproj -scheme Aukkhor -configuration Debug -destination "platform=iOS Simulator,id=$AUKKHOR_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/AukkhorSimulatorDerived" -parallel-testing-enabled NO -only-testing:AukkhorUITests -resultBundlePath KeyboardIntegrationRetry.xcresult CODE_SIGNING_ALLOWED=NO
          else
            exit "$ui_status"
          fi
      - name: Export keyboard screenshots
        if: always()
        run: |
          if [ -d KeyboardLayout.xcresult ]; then
            xcrun xcresulttool export attachments --path KeyboardLayout.xcresult --output-path KeyboardScreenshots
          fi
          for integration in KeyboardIntegration KeyboardIntegrationRetry; do
            if [ -d "$integration.xcresult" ]; then
              xcrun xcresulttool export attachments --path "$integration.xcresult" --output-path "${integration}Screenshots"
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Aukkhor-layout-test-evidence-${{ github.run_number }}
          path: |
            KeyboardLayout.xcresult
            KeyboardScreenshots
            KeyboardIntegration.xcresult
            KeyboardIntegrationScreenshots
            KeyboardIntegrationRetry.xcresult
            KeyboardIntegrationRetryScreenshots
      - uses: actions/upload-artifact@v4
        with:
          name: Aukkhor-iOS-unsigned-${{ github.run_number }}
          path: Aukkhor-unsigned.ipa
          if-no-files-found: error
