name: Aukkhor iOS unsigned build
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare approved Aukkhor icon for asset catalog
        run: |
          sips -z 1024 1024 ios/Assets.xcassets/AppIcon.appiconset/AukkhorIcon.png >/dev/null
          sips -g pixelWidth -g pixelHeight ios/Assets.xcassets/AppIcon.appiconset/AukkhorIcon.png
      - name: Show Xcode and iPhoneOS toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile app and embedded keyboard
        run: |
          set -euo pipefail
          xcodebuild -project ios/Aukkhor.xcodeproj -scheme Aukkhor -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/AukkhorDerived" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION='${{ github.run_number }}' build
          APP="$RUNNER_TEMP/AukkhorDerived/Build/Products/Release-iphoneos/Aukkhor.app"
          test -d "$APP/PlugIns/AukkhorKeyboard.appex"
          test ! -d "$APP/PlugIns/AukkhorShare.appex"
          test -s "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$APP/PlugIns/AukkhorKeyboard.appex/Info.plist" | grep -Fx com.apple.keyboard-service
          for plist in "$APP/Info.plist" "$APP/PlugIns/AukkhorKeyboard.appex/Info.plist"; do
            display_name=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$plist")
            test -n "$display_name" || { echo "::error::Missing CFBundleDisplayName in $plist"; exit 1; }
            echo "$plist: $display_name"
          done
          mkdir -p "$RUNNER_TEMP/AukkhorPackage/Payload"
          cp -R "$APP" "$RUNNER_TEMP/AukkhorPackage/Payload/"
          (cd "$RUNNER_TEMP/AukkhorPackage" && zip -qr "$GITHUB_WORKSPACE/Aukkhor-unsigned.ipa" Payload)
      - name: Inspect arm64 architecture and bundle metadata
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/AukkhorDerived/Build/Products/Release-iphoneos/Aukkhor.app"
          xcrun lipo -archs "$APP/Aukkhor" | grep -w arm64
          xcrun lipo -archs "$APP/PlugIns/AukkhorKeyboard.appex/AukkhorKeyboard" | grep -w arm64
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleSupportedPlatforms:0' "$APP/Info.plist" | grep -Fx iPhoneOS
      - name: Audit keyboard-only IPA before publishing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib, zipfile
          with zipfile.ZipFile('Aukkhor-unsigned.ipa') as ipa:
              names=set(ipa.namelist())
              host='Payload/Aukkhor.app/Info.plist'
              keyboard='Payload/Aukkhor.app/PlugIns/AukkhorKeyboard.appex/Info.plist'
              assert host in names and keyboard in names, 'Host or keyboard Info.plist missing'
              assert not any('/AukkhorShare.appex/' in n for n in names), 'Share extension must be absent'
              root=plistlib.loads(ipa.read(host))
              ext=plistlib.loads(ipa.read(keyboard))
              assert root['CFBundleIdentifier']=='dev.soum91.aukkhor'
              assert ext['CFBundleIdentifier']=='dev.soum91.aukkhor.keyboard'
              assert ext['NSExtension']['NSExtensionPointIdentifier']=='com.apple.keyboard-service'
              for name, info in [(host,root),(keyboard,ext)]:
                  assert str(info.get('CFBundleDisplayName','')).strip(), name
              print('Validated exactly one embedded keyboard extension')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Aukkhor-iOS-unsigned-${{ github.run_number }}
          path: Aukkhor-unsigned.ipa
          if-no-files-found: error
